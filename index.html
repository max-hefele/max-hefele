<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Künstlerprofil | Melodic Techno</title>
    <!-- Tailwind CSS CDN für modernes Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Styles für den perfekten Vibe */
        body {
            background-color: #0b0b0b;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* Glasmorphismus & Blur für die schwebende Navigation */
        .glass-nav {
            background: rgba(11, 11, 11, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Dezenter Glow-Effekt für den Booking-Button */
        .glow-btn {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.6);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-black">

    <!-- 1. FLÜSSIGE, SCHWEBENDE NAVIGATION -->
    <header class="fixed top-0 left-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <!-- Logo / Künstlername -->
            <a href="#" class="text-xl font-bold tracking-widest uppercase text-white">
                ARTIST<span class="text-cyan-400">.</span>
            </a>

            <!-- Menü-Links -->
            <nav class="hidden md:flex items-center space-x-8 text-sm tracking-wider text-gray-400">
                <a href="#music" class="hover:text-white transition-colors">MUSIC</a>
                <a href="#dates" class="hover:text-white transition-colors">DATES</a>
                <a href="#about" class="hover:text-white transition-colors">ABOUT</a>
            </nav>

            <!-- DER EINE BOOKING BUTTON -->
            <div>
                <a href="#booking" class="glow-btn bg-cyan-500 text-black font-semibold text-xs tracking-widest uppercase px-6 py-3 rounded-full">
                    Book Now
                </a>
            </div>
        </div>
    </header>

    <!-- 2. HERO SEKTION MIT BEWEGUNG & ATMOSPHÄRE -->
    <section class="relative h-screen flex items-center justify-center text-center px-6 overflow-hidden">
        <!-- Hintergrund-Atmosphäre (Platzhalter für Video/Dark Visual) -->
        <div class="absolute inset-0 z-0 opacity-40 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-neutral-800 via-[#0b0b0b] to-[#0b0b0b]"></div>

        <div class="relative z-10 max-w-3xl mx-auto space-y-6">
            <span class="text-xs uppercase tracking-[0.3em] text-cyan-400 block">Immersive Grooves & Deep Melodies</span>
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight text-white">
                SOUND DESIGNED FOR THE DARK.
            </h1>
            <p class="text-gray-400 max-w-xl mx-auto text-sm md:text-base">
                Hypnotic rhythms and emotional soundscapes pushing the boundaries of modern club culture.
            </p>
        </div>
    </section>

    <!-- Weitere Sektionen (Music, Dates etc.) können hier folgen -->

</body>
</html>
